<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtlasNetwork | Destek Paneli</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080a0c; --card: #111418; --primary: #00ff88; --primary-glow: rgba(0, 255, 136, 0.2);
            --accent: #5865f2; --text: #ffffff; --text-dim: #94a3b8; --border: #1e293b;
            --danger: #ff4757; --glass: rgba(17, 20, 24, 0.8);
        }

        body { 
            background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; display: flex; min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #111827 0%, #080a0c 100%);
        }

        /* SIDEBAR */
        .sidebar { 
            width: 280px; background: var(--glass); backdrop-filter: blur(12px);
            border-right: 1px solid var(--border); padding: 30px 20px; position: fixed; height: 100vh;
            box-sizing: border-box; display: flex; flex-direction: column; z-index: 100;
        }

        .logo { font-weight: 800; font-size: 24px; margin-bottom: 40px; color: var(--primary); text-shadow: 0 0 15px var(--primary-glow); }

        .nav-item { 
            display: flex; align-items: center; gap: 12px; padding: 14px 18px; 
            color: var(--text-dim); text-decoration: none; border-radius: 14px; 
            transition: 0.3s; margin-bottom: 8px; border: 1px solid transparent;
        }

        .nav-item:hover, .nav-item.active { background: rgba(0, 255, 136, 0.05); color: var(--primary); border-color: rgba(0, 255, 136, 0.1); }

        .main-content { margin-left: 280px; flex: 1; padding: 50px; max-width: 1000px; }

        /* TICKET LIST */
        .ticket-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 20px;
            padding: 20px 25px; margin-bottom: 15px; display: flex; align-items: center;
            justify-content: space-between; transition: 0.3s;
        }
        .ticket-card:hover { border-color: var(--primary); transform: translateY(-2px); }

        /* MODAL TASARIMI */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px); z-index: 1000; place-items: center; padding: 20px;
        }
        .modal-content {
            background: var(--card); border: 1px solid var(--border); border-radius: 24px;
            width: 100%; max-width: 500px; padding: 30px; animation: slideUp 0.3s ease;
        }

        /* INPUTLAR */
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--text-dim); font-size: 13px; }
        .input-field {
            width: 100%; background: #0c0f12; border: 1px solid var(--border);
            border-radius: 12px; padding: 12px 15px; color: white; outline: none;
            font-family: inherit; box-sizing: border-box;
        }
        .input-field:focus { border-color: var(--primary); }

        /* BUTTONS */
        .btn { padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-primary:hover { opacity: 0.9; transform: scale(1.02); }
        .btn-ghost { background: transparent; color: var(--text-dim); }

        /* SOHBET */
        #ticketDetailView { display: none; background: var(--card); border-radius: 24px; border: 1px solid var(--border); padding: 30px; position: relative; }
        .chat-box { height: 450px; overflow-y: auto; padding: 20px; background: #0c0f12; border-radius: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.5; }
        .msg.admin { background: var(--accent); align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg.user { background: var(--border); align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-img { max-width: 100%; border-radius: 10px; margin-top: 10px; cursor: pointer; }

        .closed-overlay {
            position: absolute; inset: 0; background: rgba(8, 10, 12, 0.8);
            backdrop-filter: blur(5px); z-index: 50; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 24px; text-align: center;
        }

        #toast {
            position: fixed; bottom: 30px; right: 30px; padding: 15px 25px;
            background: var(--card); border-left: 4px solid var(--primary);
            border-radius: 10px; transform: translateX(200%); transition: 0.4s; z-index: 2000;
        }
        #toast.active { transform: translateX(0); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="toast">İşlem Başarılı!</div>

<div id="newTicketModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-top:0">Yeni Destek Talebi</h2>
        <div class="input-group">
            <label>Konu Başlığı</label>
            <input type="text" id="tTitle" class="input-field" placeholder="Kısaca sorununuz nedir?">
        </div>
        <div class="input-group">
            <label>Kategori</label>
            <select id="tCat" class="input-field">
                <option value="Teknik">Teknik Destek</option>
                <option value="Market">Market / Ödeme</option>
                <option value="Sikayet">Oyuncu Şikayeti</option>
            </select>
        </div>
        <div class="input-group">
            <label>Mesajınız</label>
            <textarea id="tMsg" class="input-field" style="height:100px; resize:none;" placeholder="Detayları buraya yazın..."></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button class="btn btn-ghost" onclick="closeModal()">Vazgeç</button>
            <button class="btn btn-primary" onclick="createTicket()">Talebi Başlat</button>
        </div>
    </div>
</div>

<div class="sidebar">
    <div class="logo">ATLAS</div>
    <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i> Ana Sayfa</a>
    <a href="suppport.html" class="nav-item active"><i class="fa-solid fa-headset"></i> Destek Hattı</a>
    <a href="market.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i> Market</a>
</div>

<div class="main-content">
    <div id="listView">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
            <h1>Destek Taleplerim</h1>
            <button class="btn btn-primary" onclick="openModal()">+ YENİ TALEP</button>
        </div>
        <div id="ticketList">Yükleniyor...</div>
    </div>

    <div id="ticketDetailView">
        <div id="closedOverlay" class="closed-overlay" style="display:none;">
            <i class="fa-solid fa-circle-check" style="font-size:50px; color:var(--primary); margin-bottom:15px;"></i>
            <h2>TALEP KAPATILDI</h2>
            <p style="color:var(--text-dim)">Bu görüşme sona erdi. Yeni bir talep açabilirsiniz.</p>
            <button class="btn btn-primary" onclick="location.reload()" style="margin-top:20px;">Geri Dön</button>
        </div>

        <button onclick="location.reload()" style="background:none; border:none; color:var(--text-dim); cursor:pointer; margin-bottom:20px;"><i class="fa-solid fa-arrow-left"></i> Taleplere Dön</button>
        <div class="chat-box" id="chatBox"></div>

        <div id="replyArea" style="margin-top:20px; background:rgba(255,255,255,0.02); padding:15px; border-radius:20px; border:1px solid var(--border);">
            <img id="imagePreview" style="display:none; width:60px; height:60px; border-radius:10px; margin-bottom:10px; object-fit:cover;">
            <textarea id="replyMsg" class="input-field" style="height:70px; background:none; border:none;" placeholder="Mesajınızı buraya yazın..."></textarea>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                <div style="display:flex; gap:10px;">
                    <input type="file" id="fInput" style="display:none" onchange="previewImg(this)">
                    <button class="btn btn-ghost" onclick="document.getElementById('fInput').click()"><i class="fa-solid fa-image"></i></button>
                    <button class="btn btn-danger" style="padding:8px 15px; font-size:12px;" onclick="closeTicket()">TALEBİ KAPAT</button>
                </div>
                <button class="btn btn-primary" onclick="sendReply()">GÖNDER</button>
            </div>
        </div>
    </div>
</div>

<script>
    const API = 'https://atlasnetwork.tahaozturk804.workers.dev';
    const user = decodeURIComponent((document.cookie.match(/(?:^|; )atlas_session=([^;]*)/) || [])[1] || '');
    let activeId = null, base64Img = null;

    function showToast(m) {
        const t = document.getElementById('toast');
        t.innerText = m; t.classList.add('active');
        setTimeout(() => t.classList.remove('active'), 3000);
    }

    // Modal Fonksiyonları
    function openModal() { document.getElementById('newTicketModal').style.display = 'grid'; }
    function closeModal() { document.getElementById('newTicketModal').style.display = 'none'; }

    function previewImg(input) {
        if (input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { 
                base64Img = e.target.result; 
                const p = document.getElementById('imagePreview'); 
                p.src = e.target.result; p.style.display = 'block'; 
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // Yeni Talep Oluşturma
    async function createTicket() {
        const title = document.getElementById('tTitle').value;
        const category = document.getElementById('tCat').value;
        const message = document.getElementById('tMsg').value;

        if(!title || !message) return showToast("Lütfen boş alan bırakmayın!");

        const res = await fetch(`${API}/create-ticket`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user, title, category, message })
        });

        if(res.ok) {
            showToast("Talebiniz başarıyla oluşturuldu.");
            setTimeout(() => location.reload(), 1500);
        }
    }

    async function loadTickets() {
        if(!user) return window.location.href = 'login.html';
        const res = await fetch(`${API}/my-tickets`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user }) });
        const tickets = await res.json();
        const list = document.getElementById('ticketList');
        
        if(tickets.length === 0) {
            list.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-dim)">Henüz bir talebiniz yok.</div>';
            return;
        }

        list.innerHTML = tickets.map(t => `
            <div class="ticket-card">
                <div>
                    <div style="font-weight:700; font-size:18px;">${t.title}</div>
                    <div style="font-size:12px; color:var(--text-dim)">${t.date} • ${t.category}</div>
                </div>
                <div style="display:flex; align-items:center; gap:15px;">
                    <span style="font-size:11px; font-weight:800; color:${t.status === 'Kapandı' ? '#ff4757' : '#00ff88'}">${t.status.toUpperCase()}</span>
                    <button class="btn btn-primary" style="padding:8px 15px; font-size:12px;" onclick="viewTicket('${t.id}')">DETAY</button>
                </div>
            </div>
        `).join('');
    }

    async function viewTicket(id) {
        activeId = id;
        const res = await fetch(`${API}/my-tickets`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user }) });
        const t = (await res.json()).find(x => x.id === id);

        document.getElementById('chatBox').innerHTML = t.messages.map(m => `
            <div class="msg ${m.sender === user ? 'user' : 'admin'}">
                <div style="font-size:10px; opacity:0.5; margin-bottom:5px;">${m.sender}</div>
                <div>${m.text}</div>
                ${m.image ? `<img src="${m.image}" class="chat-img" onclick="window.open(this.src)">` : ''}
            </div>
        `).join('');

        if(t.status === 'Kapandı') {
            document.getElementById('closedOverlay').style.display = 'flex';
            document.getElementById('replyArea').style.display = 'none';
        }

        document.getElementById('listView').style.display = 'none';
        document.getElementById('ticketDetailView').style.display = 'block';
        const cb = document.getElementById('chatBox'); cb.scrollTop = cb.scrollHeight;
    }

    async function sendReply() {
        const text = document.getElementById('replyMsg').value;
        if(!text && !base64Img) return;

        await fetch(`${API}/reply-ticket`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ticketId: activeId, sender: user, text, image: base64Img, isAdmin: false })
        });
        
        showToast("Mesaj gönderildi!");
        setTimeout(() => viewTicket(activeId), 500);
        document.getElementById('replyMsg').value = '';
        document.getElementById('imagePreview').style.display = 'none';
        base64Img = null;
    }

    async function closeTicket() {
        if(!confirm("Talebi kapatmak istiyor musunuz?")) return;
        await fetch(`${API}/close-ticket`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ticketId: activeId }) });
        showToast("Talep kapatıldı.");
        setTimeout(() => location.reload(), 1200);
    }

    loadTickets();
</script>
</body>
</html>
