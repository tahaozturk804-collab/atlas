<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AtlasNetwork | Destek</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #080a0c; --card: #111418; --primary: #00ff88; --text: #fff; --border: #1e293b; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; }
        .sidebar { width: 250px; background: #000; height: 100vh; padding: 20px; border-right: 1px solid var(--border); }
        .main { flex: 1; padding: 40px; }
        .ticket-card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
        .chat-box { height: 400px; overflow-y: auto; background: #000; padding: 20px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 10px; max-width: 80%; }
        .msg.admin { background: #5865f2; align-self: flex-start; }
        .msg.user { background: #1e293b; align-self: flex-end; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; background: var(--primary); font-weight: bold; }
        input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="sidebar"><h2>ATLAS</h2><p>Destek Paneli</p></div>
    <div class="main">
        <div id="listView">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h1>Taleplerim</h1>
                <button class="btn" onclick="openModal()">+ Yeni Talep</button>
            </div>
            <div id="ticketList">Yükleniyor...</div>
        </div>

        <div id="detailView" style="display:none;">
            <button onclick="location.reload()" style="color:#aaa; background:none; border:none; cursor:pointer;">← Geri</button>
            <div class="chat-box" id="chatBox"></div>
            <div style="margin-top:10px; display:flex; gap:10px;">
                <input type="text" id="replyText" placeholder="Mesajınız...">
                <button class="btn" onclick="sendReply()">Gönder</button>
            </div>
        </div>
    </div>

    <script>
        const API = "https://atlasnetwork.tahaozturk804.workers.dev";
        const user = decodeURIComponent((document.cookie.match(/(?:^|; )atlas_session=([^;]*)/) || [])[1] || '');
        let activeId = null;

        async function loadTickets() {
            const res = await fetch(`${API}/my-tickets`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user }) });
            const data = await res.json();
            document.getElementById('ticketList').innerHTML = data.map(t => `<div class="ticket-card"><div><b>${t.title}</b><br><small>${t.status}</small></div><button class="btn" onclick="viewTicket('${t.id}')">Detay</button></div>`).join('');
        }

        async function viewTicket(id) {
            activeId = id;
            const res = await fetch(`${API}/my-tickets`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user }) });
            const t = (await res.json()).find(x => x.id === id);
            document.getElementById('chatBox').innerHTML = t.messages.map(m => `<div class="msg ${m.sender === 'Admin' ? 'admin' : 'user'}"><b>${m.sender}:</b> ${m.text}</div>`).join('');
            document.getElementById('listView').style.display = 'none';
            document.getElementById('detailView').style.display = 'block';
        }

        async function sendReply() {
            const text = document.getElementById('replyText').value;
            if(!text) return;
            await fetch(`${API}/reply-ticket`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ticketId: activeId, sender: user, text }) });
            document.getElementById('replyText').value = ''; viewTicket(activeId);
        }

        async function createTicket() {
            const title = prompt("Konu:");
            const message = prompt("Mesajınız:");
            if(!title || !message) return;
            await fetch(`${API}/create-ticket`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user, title, category: 'Genel', message }) });
            loadTickets();
        }

        loadTickets();
    </script>
</body>
</html>
