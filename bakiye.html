<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakiye Yükle | AtlasMarket</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #27ae60; --dark: #121417; }
        body { background: var(--dark); color: white; font-family: 'Poppins', sans-serif; margin: 0; }
        .navbar { display: flex; justify-content: space-between; padding: 20px 8%; background: #222; border-bottom: 2px solid var(--primary); }
        .container { max-width: 800px; margin: 50px auto; padding: 0 20px; }
        .payment-card { background: #1c1f23; padding: 30px; border-radius: 15px; border: 1px solid #333; }
        .method-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .method { background: #222; padding: 20px; border-radius: 10px; border: 1px solid #444; cursor: pointer; text-align: center; transition: 0.3s; }
        .method:hover { border-color: var(--primary); background: #2a2e35; }
        .method img { width: 50px; margin-bottom: 10px; }
        input[type="number"] { width: 100%; padding: 15px; margin: 20px 0; background: #111; border: 1px solid #444; border-radius: 8px; color: white; font-size: 18px; text-align: center; }
        .pay-btn { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" style="color:white; text-decoration:none; font-weight:800;">ATLAS<span>MARKET</span></a>
        <a href="market.html" style="color:#aaa; text-decoration:none;">← Markete Dön</a>
    </nav>

    <div class="container">
        <div class="payment-card">
            <h2 style="text-align: center;">Güvenli Bakiye Yükle</h2>
            <p style="text-align: center; color: #888;">Yüklemek istediğiniz tutarı girin ve yöntemi seçin.</p>
            
            <input type="number" id="amount" placeholder="Yüklenecek Tutar (₺)" min="10">

            <div class="method-grid">
                <div class="method" onclick="selectMethod(this)">
                    <img src="https://cdn-icons-png.flaticon.com/512/349/349221.png">
                    <div>Kredi Kartı</div>
                </div>
                <div class="method" onclick="selectMethod(this)">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/b/ba/Papara_Logo.png" style="width: 80px;">
                    <div>Papara / Havale</div>
                </div>
            </div>

            <button class="pay-btn" style="margin-top: 30px;" onclick="odemeYap()">Ödemeye Geç</button>
        </div>
    </div>

    <script>
        function selectMethod(el) {
            document.querySelectorAll('.method').forEach(m => m.style.borderColor = '#444');
            el.style.borderColor = '#27ae60';
        }
        function odemeYap() {
            let tutar = document.getElementById('amount').value;
            if(tutar < 10) { alert("Minimum 10₺ yükleyebilirsin!"); return; }
            alert(tutar + "₺ ödeme için PayTR/Shipy gibi sistemlere yönlendiriliyorsunuz...");
        }
    </script>
</body>
</html>
