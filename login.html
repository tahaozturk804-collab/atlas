<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | AtlasNetwork</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2ecc71; --dark: #0f1215; }
        body { 
            background: radial-gradient(circle, #1a2a1f 0%, #0f1215 100%); 
            color: white; font-family: 'Poppins', sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; 
        }
        .login-card { 
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); 
            padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); 
            width: 100%; max-width: 360px; text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h2 { margin-bottom: 25px; font-weight: 600; font-size: 28px; }
        h2 span { color: var(--primary); }
        #error-msg { 
            display: none; background: rgba(231, 76, 60, 0.15); color: #e74c3c; 
            padding: 12px; border-radius: 8px; border: 1px solid #e74c3c; 
            margin-bottom: 20px; font-size: 14px; 
        }
        input { 
            width: 100%; padding: 12px 15px; background: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; 
            color: white; margin-bottom: 15px; box-sizing: border-box; outline: none; 
        }
        input:focus { border-color: var(--primary); }
        .login-btn { 
            width: 100%; padding: 12px; background: var(--primary); border: none; 
            border-radius: 8px; color: white; font-weight: bold; cursor: pointer; 
            font-size: 16px; transition: 0.3s; 
        }
        .login-btn:hover { background: #2ecc71; transform: translateY(-2px); }
        .footer-text { margin-top: 20px; font-size: 14px; color: #888; }
        .footer-text a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Atlas<span>Giriş</span></h2>
        <div id="error-msg"></div>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Minecraft Kullanıcı Adı" required>
            <input type="password" id="password" placeholder="Şifreniz" required>
            <button type="submit" class="login-btn">Giriş Yap</button>
        </form>
        <div class="footer-text">Hesabın yok mu? <a href="register.html">Kayıt Ol</a></div>
    </div>

<script>
document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const errorDiv = document.getElementById('error-msg');

    try {
        const response = await fetch('https://atlasnetwork.tahaozturk804.workers.dev/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user, pass })
        });

        const result = await response.text();

        if (response.ok) {
            document.cookie = `atlas_session=${encodeURIComponent(user)}; path=/; max-age=86400; samesite=lax`;
            window.location.href = "index.html";
        } else {
            errorDiv.innerText = result;
            errorDiv.style.display = "block";
        }
    } catch (err) {
        errorDiv.innerText = "Sunucuyla iletişim kurulamadı!";
        errorDiv.style.display = "block";
    }
};
</script>
</body>
</html>
