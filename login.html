<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | AtlasNetwork</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #27ae60;
            --dark-bg: #0f1215;
        }

        body {
            background: radial-gradient(circle at center, #1a2a1f 0%, var(--dark-bg) 100%);
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h2 { margin-bottom: 25px; font-weight: 800; font-size: 28px; }
        h2 span { color: var(--primary); }

        /* Sayfa İçi Hata Mesajı Alanı */
        #error-msg {
            display: none;
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e74c3c;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .input-group { margin-bottom: 15px; text-align: left; }
        
        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(39, 174, 96, 0.2); }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 800;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover { background: #2ecc71; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3); }

        .footer-text { margin-top: 20px; font-size: 14px; color: #888; }
        .footer-text a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .back-home { display: block; margin-top: 15px; color: #555; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Atlas<span>Giriş</span></h2>
        
        <div id="error-msg"></div>

        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="Minecraft Kullanıcı Adı" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Şifreniz" required>
            </div>
            <button type="submit" class="login-btn">Giriş Yap</button>
        </form>

        <div class="footer-text">
            Hesabın yok mu? <a href="register.html">Kayıt Ol</a>
        </div>
        <a href="index.html" class="back-home">← Ana Sayfaya Dön</a>
    </div>

<script>
document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const errorDiv = document.getElementById('error-msg');

    // Hata mesajını temizle ve butonu beklemeye al
    errorDiv.style.display = "none";

    try {
        const response = await fetch('https://atlasnetwork.tahaozturk804.workers.dev/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user, pass })
        });

        const result = await response.text();

        if (response.ok) {
            // SADECE Worker "Giriş başarılı!" derse burası çalışır
            localStorage.setItem('atlas_session', user);
            window.location.href = "index.html";
        } else {
            // Eğer kullanıcı yoksa (404) veya şifre yanlışsa (401) burası çalışır
            errorDiv.innerText = "HATA: " + result;
            errorDiv.style.display = "block";
        }
    } catch (err) {
        errorDiv.innerText = "HATA: Sunucuyla iletişim kurulamadı!";
        errorDiv.style.display = "block";
    }
};
</script>
</body>
</html>
