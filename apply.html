<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yetkili Başvurusu | AtlasNetwork</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #27ae60; --dark-bg: #0f1215; --card-bg: #1c1f23; }
        body { background: var(--dark-bg); color: white; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .apply-card { background: var(--card-bg); padding: 30px; border-radius: 15px; width: 100%; max-width: 600px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #bbb; }
        input, textarea, select { width: 100%; padding: 12px; background: #111; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; outline: none; font-family: inherit; }
        input:focus, textarea:focus { border-color: var(--primary); }
        .btn-submit { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 20px; font-size: 16px; }
        .btn-submit:hover { background: #2ecc71; transform: translateY(-2px); }
        #response-msg { margin-top: 15px; padding: 10px; border-radius: 5px; display: none; text-align: center; }
    </style>
</head>
<body>

<div class="apply-card">
    <h2>Yetkili Başvuru Formu</h2>
    <div id="response-msg"></div>

    <form id="applyForm">
        <div class="form-group">
            <label>Adınız</label>
            <input type="text" id="realName" required placeholder="Gerçek adınız">
        </div>

        <div class="form-group">
            <label>Oyun İçi Adınız (IGN)</label>
            <input type="text" id="gameName" required placeholder="Minecraft adınız">
        </div>

        <div class="form-group">
            <label>Discord veya Instagram Adresiniz</label>
            <input type="text" id="contact" required placeholder="Sizinle nasıl iletişime geçelim?">
        </div>

        <div class="form-group">
            <label>Yaşınız</label>
            <input type="number" id="age" required placeholder="Örn: 17">
        </div>

        <div class="form-group">
            <label>Hangi Yetkiyi İstiyorsunuz?</label>
            <select id="rank">
                <option value="Rehber">Rehber</option>
                <option value="AAC">AAC (Hile Koruması)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Neden AtlasNetwork?</label>
            <textarea id="whyUs" required placeholder="Neden bizimle çalışmak istiyorsun?"></textarea>
        </div>

        <div class="form-group">
            <label>Daha önce nerede yetkili oldunuz? (Yetkinizle birlikte)</label>
            <textarea id="experience" required placeholder="Örn: X sunucusunda Adminlik yaptım..."></textarea>
        </div>

        <div class="form-group">
            <label>Eklemek istediğiniz bir şey var mı?</label>
            <textarea id="extra" placeholder="Belirtmek istediğiniz ek notlar..."></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Başvuruyu Tamamla</button>
    </form>
</div>

<script>
    document.getElementById('applyForm').onsubmit = async (e) => {
        e.preventDefault();
        const user = decodeURIComponent((document.cookie.match(/(?:^|; )atlas_session=([^;]*)/) || [])[1] || '');
        if (!user) { alert("Önce giriş yapmalısın!"); return; }

        const btn = document.getElementById('submitBtn');
        const msgBox = document.getElementById('response-msg');

        // Tüm alanları birleştirip tek bir "content" haline getiriyoruz
        const fullContent = `
            AD: ${document.getElementById('realName').value}
            IGN: ${document.getElementById('gameName').value}
            İLETİŞİM: ${document.getElementById('contact').value}
            YAŞ: ${document.getElementById('age').value}
            YETKİ: ${document.getElementById('rank').value}
            NEDEN BİZ: ${document.getElementById('whyUs').value}
            TECRÜBE: ${document.getElementById('experience').value}
            NOT: ${document.getElementById('extra').value}
        `;

        btn.disabled = true;
        btn.innerText = "Gönderiliyor...";

        try {
            const response = await fetch('https://atlasnetwork.tahaozturk804.workers.dev/submit-apply', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, content: fullContent })
            });

            const result = await response.text();
            msgBox.style.display = "block";
            
            if (response.ok) {
                msgBox.style.background = "rgba(39, 174, 96, 0.2)";
                msgBox.style.color = "#2ecc71";
                msgBox.innerText = "Başvurunuz alındı! Adminler inceleyecektir.";
                document.getElementById('applyForm').reset();
            } else {
                msgBox.style.background = "rgba(231, 76, 60, 0.2)";
                msgBox.style.color = "#e74c3c";
                msgBox.innerText = result;
            }
        } catch (err) {
            msgBox.innerText = "Sunucu hatası!";
            msgBox.style.display = "block";
        } finally {
            btn.disabled = false;
            btn.innerText = "Başvuruyu Tamamla";
        }
    };
</script>

</body>
</html>
