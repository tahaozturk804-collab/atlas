<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Başvuru | Atlas</title>
    <style>
        body { background: #0a0e14; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #161b22; padding: 30px; border-radius: 12px; width: 400px; border: 1px solid #21262d; }
        input, textarea { width: 100%; padding: 10px; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px; margin-top: 10px; }
        .btn { width: 100%; padding: 12px; background: #00d4aa; border: none; border-radius: 6px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Yetkili Başvurusu</h2>
        <input type="text" id="name" placeholder="Adınız">
        <textarea id="exp" placeholder="Tecrübeleriniz ve neden biz?"></textarea>
        <button class="btn" onclick="sendApply()">Başvuruyu Gönder</button>
    </div>
    <script>
        const fullContent = `
    AD: ${document.getElementById('realName').value}
    IGN: ${document.getElementById('gameName').value}
    İLETİŞİM: ${document.getElementById('contact').value}
    YAŞ: ${document.getElementById('age').value}
    YETKİ: ${document.getElementById('rank').value}
    NEDEN: ${document.getElementById('whyUs').value}
    TECRÜBE: ${document.getElementById('experience').value}
`;

await fetch('https://atlasnetwork.tahaozturk804.workers.dev/submit-apply', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user, content: fullContent })
});
        async function sendApply() {
            const user = decodeURIComponent((document.cookie.match(/(?:^|; )atlas_session=([^;]*)/) || [])[1] || '');
            const content = `Ad: ${document.getElementById('name').value}\nBilgi: ${document.getElementById('exp').value}`;
            await fetch("https://atlasnetwork.tahaozturk804.workers.dev/submit-apply", { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user, content }) });
            alert("Başvuru alındı!"); location.href = 'index.html';
        }
    </script>
</body>
</html>
