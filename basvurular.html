<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Başvurular - AtlasNetwork</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg-dark: #0b0e11; --sidebar-bg: #0d1117; --card-bg: #161b22; --text-main: #c9d1d9; --text-muted: #8b949e; --info: #00d2ff; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; }
        
        /* SIDEBAR */
        .sidebar { width: 260px; background: var(--sidebar-bg); height: 100vh; position: fixed; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
        .sidebar-logo { padding: 30px; text-align: center; }
        .sidebar-logo img { width: 60px; filter: drop-shadow(0 0 8px var(--primary)); }
        .sidebar-logo h2 { color: var(--primary); font-size: 18px; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .nav-menu { padding: 10px 15px; flex-grow: 1; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text-muted); text-decoration: none; border-radius: 10px; transition: 0.3s; margin-bottom: 5px; font-weight: 500; }
        .nav-item:hover, .nav-item.active { background: rgba(0, 255, 136, 0.1); color: var(--primary); }
        .nav-item i { font-size: 18px; width: 25px; }
        .sidebar-footer { padding: 20px; border-top: 1px solid #30363d; font-size: 12px; text-align: center; }

        /* MAIN CONTENT */
        .main-content { margin-left: 260px; width: calc(100% - 260px); padding: 40px; }
        .page-header { margin-bottom: 30px; }
        .page-header h1 { font-size: 24px; color: #fff; margin: 0; }

        /* APPLICATION TABLE */
        .card { background: var(--card-bg); border: 1px solid #30363d; border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(255,255,255,0.02); padding: 15px; color: var(--text-muted); font-size: 13px; }
        td { padding: 15px; border-top: 1px solid #30363d; font-size: 14px; }
        
        .type-badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; background: rgba(0, 210, 255, 0.1); color: var(--info); }
        .btn-action { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 12px; }
        .btn-approve { background: var(--primary); color: #000; margin-right: 5px; }
        .btn-reject { background: #30363d; color: #fff; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="https://img.icons8.com/neon/96/shield.png" alt="Atlas Logo">
            <h2>Atlas Admin</h2>
        </div>
        <nav class="nav-menu">
            <a href="hesaplar.html" class="nav-item"><i class="fa-solid fa-users"></i> Kullanıcı Yönetimi</a>
            <a href="urunler.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i> Mağaza Yönetimi</a>
            <a href="destek.html" class="nav-item"><i class="fa-solid fa-ticket"></i> Destek Sistemi</a>
            <a href="basvurular.html" class="nav-item active"><i class="fa-solid fa-file-signature"></i> Başvurular</a>
        </nav>
        <div class="sidebar-footer">
            <code style="color: var(--primary);">IP: 157.90.133.100</code>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1>📝 Başvurular</h1>
            <p style="color: var(--text-muted);">Yetkili ekibine katılmak isteyen adayları değerlendir.</p>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Oyuncu Adı</th>
                        <th>Başvuru Türü</th>
                        <th>Yaş</th>
                        <th>Tarih</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong>Kaan_PvP</strong></td>
                        <td><span class="type-badge">Rehber</span></td>
                        <td>17</td>
                        <td>Dün, 22:40</td>
                        <td>
                            <button class="btn-action btn-approve">Onayla</button>
                            <button class="btn-action btn-reject">Reddet</button>
                        </td>
                    </tr>
                    <tr>
                        <td><strong>Mert_YT</strong></td>
                        <td><span class="type-badge" style="color:#ff00ff; background:rgba(255,0,255,0.1)">YouTuber</span></td>
                        <td>19</td>
                        <td>2 Gün Önce</td>
                        <td>
                            <button class="btn-action btn-approve">Onayla</button>
                            <button class="btn-action btn-reject">Reddet</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
