<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol | AtlasNetwork</title>
    <style>
        body { background: #0f1215; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1c1f23; padding: 40px; border-radius: 20px; width: 350px; text-align: center; border: 1px solid #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #111; border: 1px solid #444; border-radius: 8px; color: white; box-sizing: border-box; outline: none; }
        .btn { width: 100%; padding: 12px; background: #27ae60; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 15px; }
        /* Hata Mesajı CSS */
        #error-box { display: none; background: rgba(255, 71, 87, 0.1); color: #ff4757; padding: 10px; border-radius: 5px; border: 1px solid #ff4757; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Kayıt Ol</h2>
        <div id="error-box"></div>
        <form id="regForm">
            <input type="text" id="username" placeholder="Minecraft Kullanıcı Adı" required>
            <input type="password" id="password" placeholder="Şifre" required>
            <button type="submit" class="btn">Kayıt Ol</button>
        </form>
    </div>
<script>
document.getElementById('regForm').onsubmit = async (e) => {
    e.preventDefault();
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const errorBox = document.getElementById('error-box');

    try {
        // Kendi Worker URL'ini buraya yazdığından emin ol
        const response = await fetch('https://atlasnetwork.tahaozturk804.workers.dev/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user, pass })
        });

        const result = await response.text();

        if (response.ok) {
            // Başarılıysa oturum aç ve ana sayfaya uçur
            sessionStorage.setItem('atlas_session', user);
            window.location.href = "index.html";
        } else {
            // Worker'dan gelen hata mesajını göster (Örn: "Kullanıcı var")
            errorBox.innerText = "HATA: " + result;
            errorBox.style.display = "block";
        }
    } catch (err) {
        errorBox.innerText = "HATA: Sunucuya bağlanılamadı!";
        errorBox.style.display = "block";
    }
};
</script>
</body>
</html>
