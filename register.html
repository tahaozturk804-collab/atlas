<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol | AtlasNetwork</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2ecc71; --dark: #0f1215; --card: #1c1f23; }
        body { 
            background: radial-gradient(circle, #1a2a1f 0%, #0f1215 100%); 
            color: white; font-family: 'Poppins', sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; 
        }
        .card { 
            background: rgba(28, 31, 35, 0.8); padding: 40px; border-radius: 20px; 
            width: 100%; max-width: 380px; text-align: center; 
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        h2 { margin-bottom: 20px; font-weight: 600; letter-spacing: 1px; }
        h2 span { color: var(--primary); }
        input { 
            width: 100%; padding: 14px; margin: 10px 0; background: rgba(0,0,0,0.3); 
            border: 1px solid #333; border-radius: 10px; color: white; 
            box-sizing: border-box; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); outline: none; background: rgba(0,0,0,0.5); }
        .btn { 
            width: 100%; padding: 14px; background: var(--primary); border: none; 
            border-radius: 10px; color: white; font-weight: bold; cursor: pointer; 
            margin-top: 20px; font-size: 16px; transition: 0.3s;
        }
        .btn:hover { background: #27ae60; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3); }
        #error-box { 
            display: none; background: rgba(231, 76, 60, 0.2); color: #e74c3c; 
            padding: 12px; border-radius: 8px; border: 1px solid #e74c3c; 
            margin-bottom: 15px; font-size: 14px; 
        }
        .footer { margin-top: 20px; font-size: 14px; color: #888; }
        .footer a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Atlas<span>Kayıt</span></h2>
        <div id="error-box"></div>
        <form id="regForm">
            <input type="text" id="username" placeholder="Minecraft Kullanıcı Adı" required>
            <input type="password" id="password" placeholder="Şifre" required>
            <button type="submit" class="btn">Hesap Oluştur</button>
        </form>
        <div class="footer">Zaten hesabın var mı? <a href="login.html">Giriş Yap</a></div>
    </div>

<script>
document.getElementById('regForm').onsubmit = async (e) => {
    e.preventDefault();
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const errorBox = document.getElementById('error-box');

    try {
        const response = await fetch('https://atlasnetwork.tahaozturk804.workers.dev/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user, pass })
        });

        const result = await response.text();

        if (response.ok) {
            document.cookie = `atlas_session=${encodeURIComponent(user)}; path=/; max-age=86400; samesite=lax`;
            alert("Kayıt başarılı! Yönlendiriliyorsunuz...");
            window.location.href = "index.html";
        } else {
            errorBox.innerText = result;
            errorBox.style.display = "block";
        }
    } catch (err) {
        errorBox.innerText = "Sunucuya bağlanılamadı!";
        errorBox.style.display = "block";
    }
};
</script>
</body>
</html>
