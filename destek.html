<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destek Sistemi - AtlasNetwork</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg-dark: #0b0e11; --sidebar-bg: #0d1117; --card-bg: #161b22; --text-main: #c9d1d9; --text-muted: #8b949e; --warning: #ffab00; --danger:#ff4d4d; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; }
        .sidebar { width: 260px; background: var(--sidebar-bg); height: 100vh; position: fixed; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
        .sidebar-logo { padding: 30px; text-align: center; }
        .sidebar-logo img { width: 60px; filter: drop-shadow(0 0 8px var(--primary)); }
        .sidebar-logo h2 { color: var(--primary); font-size: 18px; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .nav-menu { padding: 10px 15px; flex-grow: 1; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text-muted); text-decoration: none; border-radius: 10px; transition: 0.3s; margin-bottom: 5px; font-weight: 500; }
        .nav-item:hover, .nav-item.active { background: rgba(0, 255, 136, 0.1); color: var(--primary); }
        .main-content { margin-left: 260px; width: calc(100% - 260px); padding: 40px; }
        .ticket-card { background: var(--card-bg); border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .ticket-top { display:flex; justify-content:space-between; gap:20px; }
        .ticket-meta { font-size: 13px; color: var(--text-muted); display: flex; gap: 12px; flex-wrap: wrap; margin-top:8px; }
        .btn { border:none; border-radius:8px; padding:8px 12px; cursor:pointer; font-weight:600; }
        .btn-view { background: var(--primary); color:#000; }
        .btn-close { background: rgba(255,77,77,0.15); color:var(--danger); }
        .conversation { margin-top:15px; border-top:1px solid #30363d; padding-top:12px; }
        .msg { background:#0f141b; border:1px solid #30363d; border-radius:8px; padding:8px 10px; margin-bottom:8px; }
        textarea { width:100%; background:#0b0e11; border:1px solid #30363d; color:#fff; border-radius:8px; padding:10px; min-height:78px; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="https://img.icons8.com/neon/96/shield.png" alt="Atlas Logo"><h2>Atlas Admin</h2>
        </div>
        <nav class="nav-menu">
            <a href="hesaplar.html" class="nav-item"><i class="fa-solid fa-users"></i> Kullanıcı Yönetimi</a>
            <a href="urunler.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i> Mağaza Yönetimi</a>
            <a href="destek.html" class="nav-item active"><i class="fa-solid fa-ticket"></i> Destek Sistemi</a>
            <a href="basvurular.html" class="nav-item"><i class="fa-solid fa-file-signature"></i> Başvurular</a>
        </nav>
    </aside>

    <main class="main-content">
        <h1>🎫 Destek Talepleri</h1>
        <p style="color: var(--text-muted);">Talepleri inceleyip admin yanıtı yazabilir veya kapatabilirsin.</p>
        <div class="ticket-list" id="adminTicketList"><p style="color:#8b949e;">Destek talepleri yükleniyor...</p></div>
    </main>

<script>
const API = 'https://atlasnetwork.tahaozturk804.workers.dev';
let ticketsCache = [];

async function updateTicketStatus(id, status) {
  const res = await fetch(`${API}/api/update`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ table: 'tickets', id, updates: { status } })
  });
  if (!res.ok) return alert(await res.text());
  await loadAdminTickets();
}

async function sendAdminReply(id) {
  const text = (document.getElementById(`reply-${id}`)?.value || '').trim();
  if (!text) return;

  const res = await fetch(`${API}/reply-ticket`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ticketId: id, sender: 'Admin', text, isAdmin: true })
  });
  if (!res.ok) return alert(await res.text());
  await loadAdminTickets();
}

function toggleConversation(id) {
  const el = document.getElementById(`conv-${id}`);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function loadAdminTickets() {
  const list = document.getElementById('adminTicketList');
  try {
    const res = await fetch(`${API}/api/get-all`);
    const data = await res.json();
    const tickets = (data.tickets || []).sort((a, b) => Number(b.id || 0) - Number(a.id || 0));
    ticketsCache = tickets;

    if (!tickets.length) {
      list.innerHTML = '<p style="color:#8b949e;">Henüz destek talebi yok.</p>';
      return;
    }

    list.innerHTML = tickets.map(t => {
      const isClosed = t.status === 'Kapandı';
      const msgHtml = (t.messages || []).map(m => `<div class="msg"><b>${m.sender}:</b> ${m.text}</div>`).join('') || '<div class="msg">Mesaj yok.</div>';
      return `
      <div class="ticket-card" style="opacity:${isClosed ? 0.75 : 1}">
        <div class="ticket-top">
          <div>
            <h3 style="margin:0">${t.title}</h3>
            <div class="ticket-meta">
              <span>👤 ${t.user}</span><span>📁 ${t.category || 'Genel'}</span><span>🕒 ${t.date || '-'}</span>
              <span style="color:${isClosed ? '#ff4d4d' : '#00ff88'}">${t.status || 'Açık'}</span>
            </div>
          </div>
          <div style="display:flex; gap:8px; align-items:flex-start;">
            <button class="btn btn-view" onclick="toggleConversation('${t.id}')">Detay</button>
            ${isClosed ? '' : `<button class="btn btn-close" onclick="updateTicketStatus('${t.id}','Kapandı')">Kapat</button>`}
          </div>
        </div>
        <div class="conversation" id="conv-${t.id}" style="display:none;">
          ${msgHtml}
          ${isClosed ? '<p style="color:#8b949e; margin:8px 0 0;">Talep kapalı.</p>' : `
          <textarea id="reply-${t.id}" placeholder="Admin cevabını yaz..."></textarea>
          <div style="margin-top:8px;"><button class="btn btn-view" onclick="sendAdminReply('${t.id}')">Yanıt Gönder</button></div>`}
        </div>
      </div>`;
    }).join('');
  } catch {
    list.innerHTML = '<p style="color:#ff4d4d;">Destek talepleri yüklenemedi.</p>';
  }
}

loadAdminTickets();
</script>
</body>
</html>
