<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtlasNetwork | Profil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080a0c;
            --card: #111418;
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.1);
            --accent: #3d5afe;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: #1e293b;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            max-width: 1100px;
            width: 100%;
            margin: 50px auto;
            padding: 0 20px;
        }

        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        
        .profile-card {
            background: var(--card);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .avatar-wrapper img {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            background: #0c0f12;
            padding: 5px;
            border: 2px solid var(--border);
            margin-bottom: 15px;
        }

        .user-info h3 { margin: 0; font-size: 22px; letter-spacing: -0.5px; }
        .role-tag {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .nav-menu {
            background: var(--card);
            border-radius: 24px;
            padding: 12px;
            border: 1px solid var(--border);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            color: var(--text-dim);
            text-decoration: none;
            border-radius: 14px;
            transition: 0.3s;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.03);
            color: var(--primary);
        }

        /* STATS */
        .stats-single {
            background: var(--card);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-icon {
            width: 55px;
            height: 55px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: var(--primary-glow);
            color: var(--primary);
        }

        .main-panel {
            background: var(--card);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 35px;
            margin-bottom: 25px;
        }

        .section-title { margin-bottom: 25px; }
        .section-title h2 { font-size: 18px; display: flex; align-items: center; gap: 10px; margin: 0; }

        .info-table { width: 100%; border-collapse: collapse; }
        .info-table td { padding: 18px 0; border-bottom: 1px solid var(--border); }
        .label { color: var(--text-dim); font-size: 14px; }
        .value { text-align: right; font-weight: 600; }

        /* SECURITY SETTINGS */
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .input-box {
            background: #080a0c;
            border: 1px solid var(--border);
            color: white;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 12px;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
        }
        .input-box:focus { border-color: var(--primary); }

        .btn-action {
            background: var(--primary);
            color: black;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            border: none;
            transition: 0.3s;
        }

        .btn-action:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-blue { background: var(--accent); color: white; }

    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="profile-card">
            <div class="avatar-wrapper">
                <img id="headImg" src="https://minotar.net/avatar/steve/100">
            </div>
            <div class="user-info">
                <h3 id="uName">Yükleniyor...</h3>
                <div id="uBadge" class="role-tag" style="background: rgba(0, 255, 136, 0.1); color: var(--primary); border: 1px solid var(--primary);">OYUNCU</div>
            </div>
        </div>

        <div class="nav-menu">
            <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i> Profil</a>
            <a href="apply.html" class="nav-item"><i class="fa-solid fa-envelope-open-text"></i> Başvuru</a>
            <a href="support.html" class="nav-item"><i class="fa-solid fa-headset"></i> Destek</a>
            <a href="market.html" class="nav-item"><i class="fa-solid fa-cart-shopping"></i> Market</a>
            <a href="#" onclick="logout()" class="nav-item" style="color: #ff5252; margin-top: 10px;"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</a>
        </div>
    </div>

    <div class="content">
        <div class="stats-single">
            <div class="stat-icon"><i class="fa-solid fa-wallet"></i></div>
            <div>
                <div style="font-size: 13px; color: var(--text-dim); margin-bottom: 4px;">Mevcut Bakiye</div>
                <div style="font-size: 24px; font-weight: 800; color: white;" id="sBakiye">0.00 TL</div>
            </div>
        </div>

        <div class="main-panel">
            <div class="section-title">
                <h2><i class="fa-solid fa-id-card" style="color: var(--primary);"></i> Hesap Özeti</h2>
            </div>
            <table class="info-table">
                <tr><td class="label">E-Posta Adresi</td><td class="value" id="valEmail">-</td></tr>
                <tr><td class="label">Kayıt Tarihi</td><td class="value" id="valRegDate">-</td></tr>
                <tr><td class="label">Hesap Statüsü</td><td class="value" style="color: var(--primary);">Doğrulanmış</td></tr>
            </table>
        </div>

        <div class="main-panel">
            <div class="section-title">
                <h2><i class="fa-solid fa-shield-halved" style="color: var(--accent);"></i> Güvenlik & Ayarlar</h2>
            </div>
            <div class="settings-grid">
                <div>
                    <h4 style="margin: 0 0 15px 0; font-size: 14px; color: var(--text-dim);">Şifre İşlemleri</h4>
                    <input type="password" id="oldPass" class="input-box" placeholder="Mevcut Şifre">
                    <input type="password" id="newPass" class="input-box" placeholder="Yeni Şifre">
                    <button onclick="updateSecurity(true)" class="btn-action">Değişiklikleri Kaydet</button>
                </div>
                <div>
                    <h4 style="margin: 0 0 15px 0; font-size: 14px; color: var(--text-dim);">E-Posta Güncelle</h4>
                    <input type="email" id="newEmail" class="input-box" placeholder="Yeni E-Posta">
                    <p style="font-size: 11px; color: var(--text-dim); line-height: 1.5;">Hesap güvenliği için aktif bir mail adresi kullanmanız önerilir.</p>
                    <button onclick="updateSecurity(false)" class="btn-action btn-blue">Maili Güncelle</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = "https://atlasnetwork.tahaozturk804.workers.dev";

    async function loadData() {
        const user = localStorage.getItem('atlas_session');
        if (!user) { window.location.href = 'login.html'; return; }

        try {
            const res = await fetch(`${API_BASE}/get-profile`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user })
            });

            if (res.ok) {
                const data = await res.json();
                document.getElementById('uName').innerText = user;
                document.getElementById('headImg').src = `https://minotar.net/avatar/${user}/100`;
                document.getElementById('sBakiye').innerText = (data.bakiye || 0) + " TL";
                document.getElementById('valRegDate').innerText = data.registerDate || "Bilinmiyor";
                document.getElementById('valEmail').innerText = data.email || "Tanımlanmamış";
                
                if(data.role === 'admin') {
                    const badge = document.getElementById('uBadge');
                    badge.innerText = "YÖNETİCİ";
                    badge.style.borderColor = "#ff5252";
                    badge.style.color = "#ff5252";
                    badge.style.background = "rgba(255, 82, 82, 0.1)";
                }
            }
        } catch (e) { console.error("Veri yüklenemedi"); }
    }

    async function updateSecurity(isPass) {
        const user = localStorage.getItem('atlas_session');
        const payload = { user };

        if(isPass) {
            payload.oldPass = document.getElementById('oldPass').value;
            payload.newPass = document.getElementById('newPass').value;
            if(!payload.oldPass || !payload.newPass) return alert("Lütfen alanları doldurun!");
        } else {
            payload.newEmail = document.getElementById('newEmail').value;
            if(!payload.newEmail) return alert("Lütfen geçerli bir e-posta girin!");
        }

        const res = await fetch(`${API_BASE}/update-security`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        
        const msg = await res.text();
        alert(msg);
        if(res.ok) location.reload();
    }

    function logout() {
        localStorage.removeItem('atlas_session');
        window.location.href = 'login.html';
    }

    loadData();
</script>

</body>
</html>
